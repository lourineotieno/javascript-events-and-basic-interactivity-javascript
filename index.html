<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to My Interactive Web Page 🎨</h1>

  <!-- 🌙 Light/Dark Mode Toggle -->
  <button id="toggleModeBtn">Switch to Dark Mode</button>

  <!-- 🎯 Counter Game -->
  <section id="counterSection">
    <h2>Click Counter Game</h2>
    <p>Clicks: <span id="count">0</span></p>
    <button id="increaseBtn">Click Me!</button>
    <button id="resetBtn">Reset</button>
  </section>

  <!-- 💬 Collapsible FAQ -->
  <section id="faq">
    <h2>FAQ Section</h2>
    <div class="faq-item">
      <h3 class="question">What is JavaScript?</h3>
      <p class="answer">JavaScript is a programming language that adds interactivity to websites.</p>
    </div>
    <div class="faq-item">
      <h3 class="question">Why use JavaScript?</h3>
      <p class="answer">Because it makes web pages dynamic and engaging!</p>
    </div>
  </section>

  <!-- 📝 Form Validation -->
  <section id="formSection">
    <h2>Register Form</h2>
    <form id="registerForm">
      <label>Full Name:</label>
      <input type="text" id="name" placeholder="Enter full name"><br>

      <label>Email:</label>
      <input type="email" id="email" placeholder="Enter email"><br>

      <label>Password:</label>
      <input type="password" id="password" placeholder="Enter password"><br>

      <button type="submit">Submit</button>
      <p id="formMessage"></p>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
